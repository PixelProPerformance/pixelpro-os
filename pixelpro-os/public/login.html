<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PixelPro OS, entrar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="login-wrap">
  <form class="login-card" id="form">
    <div class="brand"><div class="mark">P</div><div><b>PixelPro OS</b><span>Performance</span></div></div>
    <div class="field"><label>E-mail</label><input type="email" id="email" autocomplete="username" required></div>
    <div class="field"><label>Senha</label><input type="password" id="password" autocomplete="current-password" required></div>
    <button class="btn primary block" type="submit"><i data-lucide="log-in" class="icon"></i> Entrar</button>
    <div class="err" id="err"></div>
    <div class="hint" style="margin-top:14px">Contas de exemplo do seed: admin@pixelpro.com / admin123</div>
  </form>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.446.0/lucide.min.js"></script>
<script>
if(window.lucide)lucide.createIcons();
document.getElementById('form').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const err=document.getElementById('err'); err.textContent='';
  const r=await fetch('/api/auth/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email:email.value,password:password.value})});
  const d=await r.json();
  if(r.ok){location.href='/app';} else {err.textContent = d.error==='credenciais_invalidas'?'E-mail ou senha invalidos.':'Nao foi possivel entrar.';}
});
</script>
</body>
</html>
